extensions:
  # Either token is accepted. OTLP_TOKEN_NEXT defaults to OTLP_TOKEN
  # (compose.yaml); set it to rotate without a flag day (README).
  bearertokenauth/server:
    scheme: Bearer
    tokens:
      - ${env:OTLP_TOKEN}
      - ${env:OTLP_TOKEN_NEXT}
  # Probed by Traefik's load-balancer health check (traefik/dynamic/otlp.yml);
  # the image is FROM scratch, so Docker itself can't probe it.
  health_check:
    endpoint: 0.0.0.0:13133
  # Disk-backed export queues (the otelcol-queue volume, compose.yaml):
  # accepted data waits here while a store is down, and survives a collector
  # restart.
  file_storage/queue:
    directory: /var/lib/otelcol
    create_directory: true   # lets `otelcol validate` run without the volume (CI)

receivers:
  # OTLP/HTTP only: Traefik routes nothing but :4318 here, so a gRPC receiver
  # would be unreachable from outside the docker network.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/server

processors:
  # First in every pipeline: refuses data (clients get 429/503 and retry)
  # before the container hits its memory limit (compose.yaml).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 1024

# Producers get 200 once a batch is queued, so a queued batch must not be
# dropped: retry until the store accepts it (max_elapsed_time: 0). The queue
# size (default 1000 batches per exporter) is the bound; when it is full the
# receiver refuses new data and producers retry on their side.
exporters:
  otlp_http/vm:
    endpoint: http://victoriametrics:8428/opentelemetry
    sending_queue:
      storage: file_storage/queue
    retry_on_failure:
      max_elapsed_time: 0
  otlp_http/vl:
    endpoint: http://victorialogs:9428/insert/opentelemetry
    sending_queue:
      storage: file_storage/queue
    retry_on_failure:
      max_elapsed_time: 0
  otlp_http/vt:
    endpoint: http://victoriatraces:10428/insert/opentelemetry
    sending_queue:
      storage: file_storage/queue
    retry_on_failure:
      max_elapsed_time: 0

service:
  # Internal metrics on :8888, scraped by victoriametrics (not published).
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check, bearertokenauth/server, file_storage/queue]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vl]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vt]
