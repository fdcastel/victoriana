# victoriana's alert rules: every scraped component's liveness, store disk
# space, the Traefik edge, the collector, and the TLS cert.
groups:
  - name: victoriana
    rules:
      - alert: ComponentDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Scrapes of {{ $labels.instance }} have failed for 2m."

      - alert: DiskRunsOutOfSpace
        expr: |
          sum by (job) ({__name__=~"(vm|vl|vt)_data_size_bytes"})
          /
          (sum by (job) ({__name__=~"(vm|vl|vt)_free_disk_space_bytes"})
           + sum by (job) ({__name__=~"(vm|vl|vt)_data_size_bytes"})) > 0.8
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} disk is {{ $value | humanizePercentage }} full"
          description: "Its data plus free space on ./data is over 80% used. VictoriaLogs/VictoriaTraces stop retaining at -retention.maxDiskUsagePercent=80 and all three refuse writes at -storage.minFreeDiskSpaceBytes; free space or grow the disk."

      - alert: CollectorUnhealthy
        expr: traefik_service_server_up{service="otlp@file"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Traefik marks the otel-collector unhealthy; :4318 answers 503"
          description: "The collector's health_check (:13133) has failed for 2m, so producers' data is not being accepted."

      - alert: CollectorExportFailing
        expr: sum by (exporter) (rate({__name__=~"otelcol_exporter_send_failed_.+_total"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Collector exporter {{ $labels.exporter }} is dropping data"
          description: "The store rejected data permanently (e.g. 400), so the collector dropped it; transient failures are retried and show as CollectorExportBacklog instead. See `docker compose logs otel-collector`."

      - alert: CollectorExportBacklog
        expr: max by (exporter) (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Collector export queue {{ $labels.exporter }} is {{ $value | humanizePercentage }} full"
          description: "Its store is down or slow; accepted data waits in the on-disk queue and is retried until delivered. At 100% the collector refuses new data (CollectorRefusingData)."

      - alert: CollectorRefusingData
        expr: sum(rate({__name__=~"otelcol_receiver_refused_.+_total"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Collector is refusing OTLP data"
          description: "Usually the memory_limiter: producers get 429/503 and retry. Sustained, raise OTELCOL_MEM_LIMIT or find the noisy producer."

      - alert: OTLPServerErrors
        expr: sum(rate(traefik_service_requests_total{service="otlp@file", code=~"5.."}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OTLP endpoint has returned 5xx for 10m"
          description: "Traefik reports 5xx responses on the otlp service; see the collector's logs and the CollectorUnhealthy alert."

      - alert: OTLPAuthFailures
        expr: sum(rate(traefik_service_requests_total{service="otlp@file", code="401"}[15m])) > 0.1
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Sustained 401s on the OTLP endpoint"
          description: "More than 6/min for 15m: a producer may be sending a wrong or rotated-out token (see OTLP_TOKEN_NEXT in the README)."

      - alert: TLSCertExpiringSoon
        expr: (min by (cn) (traefik_tls_certs_not_after) - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate {{ $labels.cn }} expires in {{ $value | humanizeDuration }}"
          description: "Let's Encrypt certs renew 30 days before expiry, so with OTLP_TLS_MODE=acme this means renewal is failing (`docker compose logs traefik | grep -i acme`). With byocert, replace ./certs/tls.crt."
