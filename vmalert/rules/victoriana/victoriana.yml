# victoriana's own alerts: the components the upstream rule files (upstream-*.yml)
# don't cover - the Traefik edge, the collector, Grafana - and the TLS cert.
groups:
  - name: victoriana
    rules:
      - alert: ComponentDown
        expr: up{job=~"traefik|otel-collector|grafana"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Scrapes of {{ $labels.instance }} have failed for 2m. (The Victoria components are covered by the upstream ServiceDown rules.)"

      - alert: CollectorUnhealthy
        expr: traefik_service_server_up{service="otlp@file"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Traefik marks the otel-collector unhealthy; :4318 answers 503"
          description: "The collector's health_check (:13133) has failed for 2m, so producers' data is not being accepted."

      - alert: CollectorExportFailing
        expr: sum by (exporter) (rate({__name__=~"otelcol_exporter_send_failed_.+_total"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Collector exporter {{ $labels.exporter }} is failing to send"
          description: "Data the collector accepted is not reaching its store. Check that store's health and `docker compose logs otel-collector`."

      - alert: CollectorRefusingData
        expr: sum(rate({__name__=~"otelcol_receiver_refused_.+_total"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Collector is refusing OTLP data"
          description: "Usually the memory_limiter: producers get 429/503 and retry. Sustained, raise OTELCOL_MEM_LIMIT or find the noisy producer."

      - alert: OTLPServerErrors
        expr: sum(rate(traefik_service_requests_total{service="otlp@file", code=~"5.."}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OTLP endpoint has returned 5xx for 10m"
          description: "Traefik reports 5xx responses on the otlp service; see the collector's logs and the CollectorUnhealthy alert."

      - alert: OTLPAuthFailures
        expr: sum(rate(traefik_service_requests_total{service="otlp@file", code="401"}[15m])) > 0.1
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Sustained 401s on the OTLP endpoint"
          description: "More than 6/min for 15m: a producer may be sending a wrong or rotated-out token (see OTLP_TOKEN_NEXT in the README)."

      - alert: TLSCertExpiringSoon
        expr: (min by (cn) (traefik_tls_certs_not_after) - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate {{ $labels.cn }} expires in {{ $value | humanizeDuration }}"
          description: "Let's Encrypt certs renew 30 days before expiry, so with OTLP_TLS_MODE=acme this means renewal is failing (`docker compose logs traefik | grep -i acme`). With byocert, replace ./certs/tls.crt."
