name: victoriana

services:
  # Always-on ingress. Fronts the otel-collector on :4318. TLS is selected by
  # OTLP_TLS_MODE in .env (none | acme | byocert), rendered by the
  # ./traefik/dynamic/otlp.yml template. The :4318 entrypoint is identical in
  # every mode.
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7.17}
    restart: unless-stopped
    ports:
      - "4318:4318"                                  # OTLP ingress
      # Grafana UI, via Traefik's `web` entrypoint. Default loopback (reach via
      # SSH tunnel); set TRAEFIK_WEB_BIND to expose on a network, e.g.
      # "0.0.0.0:80" (LAN) or "10.0.0.5:80" (one interface).
      - "${TRAEFIK_WEB_BIND:-127.0.0.1:80}:80"
    # Static config. It lives here, not in a traefik.yml, so it can read .env;
    # Traefik never merges static sources (a config file would silently win
    # over every flag below). Changing a flag or a .env value it reads and
    # running `docker compose up -d traefik` recreates the container.
    command:
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
      - "--entryPoints.otlp.address=:4318"
      - "--entryPoints.web.address=:80"         # Grafana UI (dynamic/grafana.yml)
      - "--entryPoints.traefik.address=:8080"   # internal: `healthcheck --ping`
      # Drop request headers whose names alias another (X_Auth_User vs
      # X-Auth-User). Our backends are Go and unaffected; this states the
      # choice and silences Traefik's per-entrypoint startup warning.
      - "--entryPoints.otlp.http.aliasHeadersStrategy=delete"
      - "--entryPoints.web.http.aliasHeadersStrategy=delete"
      - "--entryPoints.traefik.http.aliasHeadersStrategy=delete"
      - "--ping.entryPoint=traefik"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--accessLog=true"
      # Skip 404s: internet scanners probing :4318 would otherwise be most of
      # the log. 401s (bad/missing token) are kept.
      - "--accessLog.filters.statusCodes=100-403,405-599"
      # Prometheus metrics on the internal `traefik` entrypoint (:8080/metrics),
      # scraped by victoriametrics; not published.
      - "--metrics.prometheus=true"
      # Let's Encrypt resolver `le`, DNS-01 via Cloudflare. Always defined;
      # harmless until a router references it (no account, no LE traffic).
      # Cert + account persist in ./data/traefik/acme.json.
      - "--certificatesResolvers.le.acme.email=${ACME_EMAIL:-}"
      - "--certificatesResolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesResolvers.le.acme.dnsChallenge.provider=cloudflare"
      - "--certificatesResolvers.le.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      # Read by the dynamic/otlp.yml template: none | acme | byocert.
      OTLP_TLS_MODE: ${OTLP_TLS_MODE:-none}
      OTLP_HOSTNAME: ${OTLP_HOSTNAME:-}
      # Read by the dynamic/grafana.yml template; both optional.
      GRAFANA_BASIC_AUTH_USERS: ${GRAFANA_BASIC_AUTH_USERS:-}
      GRAFANA_HOSTNAME: ${GRAFANA_HOSTNAME:-}
      # Read by the Cloudflare DNS provider; empty unless you use ACME.
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/traefik:/letsencrypt
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  victoriametrics:
    image: victoriametrics/victoria-metrics:${VM_VERSION:-v1.155.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - ./data/vm:/storage
      - ./victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    command:
      - "-storageDataPath=/storage"
      - "-httpListenAddr=:8428"
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-30d}"
      # Stop accepting writes (rather than corrupting/crashing) when the disk
      # is nearly full. Metrics are never deleted early.
      - "-storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK:-1GiB}"
      # Self-monitoring: scrape every component (victoriametrics/scrape.yml).
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      - "-promscrape.configCheckInterval=60s"
      # Store OTLP metrics under standard Prometheus names (dots->underscores,
      # _total for counters, unit suffixes) instead of the dotted OTel names.
      - "-opentelemetry.usePrometheusNaming=true"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  victorialogs:
    image: victoriametrics/victoria-logs:${VL_VERSION:-v1.53.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - ./data/vl:/storage
    command:
      - "-storageDataPath=/storage"
      - "-httpListenAddr=:9428"
      - "-retentionPeriod=${VL_RETENTION_PERIOD:-30d}"
      # Drop the oldest days once VictoriaLogs' own data passes this size
      # (independent of what else is on the disk), and stop accepting writes
      # below the free-space floor.
      - "-retention.maxDiskSpaceUsageBytes=${VL_MAX_DISK_USAGE:-50GiB}"
      - "-storage.minFreeDiskSpaceBytes=${VL_MIN_FREE_DISK:-1GiB}"
    # No Docker healthcheck: the image is distroless since v1.52 (no shell or
    # wget). Health is watched by self-monitoring instead: `up` in
    # victoriametrics and the ComponentDown alert.

  victoriatraces:
    image: victoriametrics/victoria-traces:${VT_VERSION:-v0.12.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:10428:10428"
    volumes:
      - ./data/vt:/storage
    command:
      - "-storageDataPath=/storage"
      - "-httpListenAddr=:10428"
      - "-retentionPeriod=${VT_RETENTION_PERIOD:-7d}"
      # Same disk guards as victorialogs.
      - "-retention.maxDiskSpaceUsageBytes=${VT_MAX_DISK_USAGE:-20GiB}"
      - "-storage.minFreeDiskSpaceBytes=${VT_MIN_FREE_DISK:-1GiB}"
    # No Docker healthcheck: distroless since v0.10 (see victorialogs).

  vmalert:
    image: victoriametrics/vmalert:${VMALERT_VERSION:-v1.155.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    # vmalert won't start with alerting rules and no notifier, and its three
    # notifier flags are mutually exclusive: send to VMALERT_NOTIFIER_URL (an
    # Alertmanager) if set, else discard (-notifier.blackhole). Firing alerts
    # still show in the vmalert UI and Grafana either way.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$$VMALERT_NOTIFIER_URL" ]; then
          set -- "$$@" "-notifier.url=$$VMALERT_NOTIFIER_URL"
        else
          set -- "$$@" -notifier.blackhole
        fi
        exec /vmalert-prod "$$@"
      - vmalert
    environment:
      VMALERT_NOTIFIER_URL: ${VMALERT_NOTIFIER_URL:-}
    command:
      - "-rule=/etc/vmalert/rules/*.yml"
      - "-rule=/etc/vmalert/rules/*/*.yml"
      - "-datasource.url=http://victoriametrics:8428"
      - "-remoteWrite.url=http://victoriametrics:8428"
      - "-evaluationInterval=30s"
      - "-httpListenAddr=:8880"
      # Re-read rule files every 60s: drop a file in, no restart.
      - "-configCheckInterval=60s"
      # Base URL in alert links; default matches the SSH tunnel in the README.
      - "-external.url=${VMALERT_EXTERNAL_URL:-http://localhost:8880}"
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8880/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.3.0}
    restart: unless-stopped
    # Internal-only: Grafana is reached through Traefik's `web` entrypoint
    # (traefik/dynamic/grafana.yml), never published directly. Control its
    # exposure with TRAEFIK_WEB_BIND on the traefik service above. Grafana ships
    # anonymous-Admin (see README "Security model"): set GRAFANA_BASIC_AUTH_USERS
    # before exposing it.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Pinned: an unpinned install yields a different plugin on every recreate.
      # GF_INSTALL_PLUGINS is deprecated since Grafana 12 and only honoured with
      # _FORCE; its replacement (GF_PLUGINS_PREINSTALL_SYNC) is ignored while
      # preinstall is disabled, and enabling preinstall also downloads ~15
      # unpinned, auto-updating catalog plugins on every start.
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource ${VL_PLUGIN_VERSION:-0.33.1}
      GF_INSTALL_PLUGINS_FORCE: "true"
      # No catalog downloads beyond the line above (Jaeger, Prometheus etc. are
      # bundled with Grafana).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # Named volume: nothing in Grafana's state is source of truth (datasources
      # and dashboards are provisioned from ./grafana/, the plugin is pinned),
      # and Docker sets the ownership Grafana (uid 472) needs.
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-shot: the collector runs as uid 10001 in a FROM-scratch image, and a
  # fresh named volume is root-owned, so hand the queue volume to that uid.
  otel-collector-init:
    image: busybox:${BUSYBOX_VERSION:-1.38.0}
    command: ["chown", "10001:10001", "/var/lib/otelcol"]
    volumes:
      - otelcol-queue:/var/lib/otelcol

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.164.0}
    restart: unless-stopped
    # No Docker healthcheck: the image is FROM scratch (no shell, wget or curl).
    # Instead Traefik probes the health_check extension on :13133 from outside
    # (traefik/dynamic/otlp.yml) and stops routing to an unhealthy collector.
    # The memory_limiter processor sizes itself from this limit.
    mem_limit: ${OTELCOL_MEM_LIMIT:-512m}
    environment:
      OTLP_TOKEN: ${OTLP_TOKEN:?set OTLP_TOKEN in .env}
      OTLP_TOKEN_NEXT: ${OTLP_TOKEN_NEXT:-${OTLP_TOKEN}}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Export queues (file_storage/queue in the config): data accepted while
      # a store is down waits here until it is back.
      - otelcol-queue:/var/lib/otelcol
    depends_on:
      otel-collector-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_started
      victoriatraces:
        condition: service_started

volumes:
  grafana-data:
  otelcol-queue:
