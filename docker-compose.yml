name: victoriana

services:
  # Always-on ingress. Fronts the otel-collector on :4318. TLS is selected by
  # OTLP_TLS_MODE in .env (none | acme | byocert), rendered by the
  # ./traefik/dynamic/otlp.yml template. The :4318 entrypoint is identical in
  # every mode.
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6.17}
    restart: unless-stopped
    ports:
      - "4318:4318"                                  # OTLP ingress
      # Grafana UI, via Traefik's `web` entrypoint. Default loopback (reach via
      # SSH tunnel); set TRAEFIK_WEB_BIND to expose on a network, e.g.
      # "0.0.0.0:80" (LAN) or "10.0.0.5:80" (one interface).
      - "${TRAEFIK_WEB_BIND:-127.0.0.1:80}:80"
    # Static config. It lives here, not in a traefik.yml, so it can read .env;
    # Traefik never merges static sources (a config file would silently win
    # over every flag below). Changing a flag or a .env value it reads and
    # running `docker compose up -d traefik` recreates the container.
    command:
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
      - "--entryPoints.otlp.address=:4318"
      - "--entryPoints.web.address=:80"         # Grafana UI (dynamic/grafana.yml)
      - "--entryPoints.traefik.address=:8080"   # internal: `healthcheck --ping`
      - "--ping.entryPoint=traefik"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--accessLog=true"
      # Skip 404s: internet scanners probing :4318 would otherwise be most of
      # the log. 401s (bad/missing token) are kept.
      - "--accessLog.filters.statusCodes=100-403,405-599"
      # Let's Encrypt resolver `le`, DNS-01 via Cloudflare. Always defined;
      # harmless until a router references it (no account, no LE traffic).
      # Cert + account persist in ./data/traefik/acme.json.
      - "--certificatesResolvers.le.acme.email=${ACME_EMAIL:-}"
      - "--certificatesResolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesResolvers.le.acme.dnsChallenge.provider=cloudflare"
      - "--certificatesResolvers.le.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      # Read by the dynamic/otlp.yml template: none | acme | byocert.
      OTLP_TLS_MODE: ${OTLP_TLS_MODE:-none}
      OTLP_HOSTNAME: ${OTLP_HOSTNAME:-}
      # Read by the dynamic/grafana.yml template; both optional.
      GRAFANA_BASIC_AUTH_USERS: ${GRAFANA_BASIC_AUTH_USERS:-}
      GRAFANA_HOSTNAME: ${GRAFANA_HOSTNAME:-}
      # Read by the Cloudflare DNS provider; empty unless you use ACME.
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/traefik:/letsencrypt
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  victoriametrics:
    image: victoriametrics/victoria-metrics:${VM_VERSION:-v1.142.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - ./data/vm:/storage
    command:
      - "-storageDataPath=/storage"
      - "-httpListenAddr=:8428"
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-30d}"
      # Stop accepting writes (rather than corrupting/crashing) when the disk
      # is nearly full. Metrics are never deleted early.
      - "-storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK:-1GiB}"
      # Store OTLP metrics under standard Prometheus names (dots->underscores,
      # _total for counters, unit suffixes) instead of the dotted OTel names.
      - "-opentelemetry.usePrometheusNaming=true"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  victorialogs:
    image: victoriametrics/victoria-logs:${VL_VERSION:-v1.50.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - ./data/vl:/storage
    command:
      - "-storageDataPath=/storage"
      - "-httpListenAddr=:9428"
      - "-retentionPeriod=${VL_RETENTION_PERIOD:-30d}"
      # Drop the oldest days once the *filesystem* (shared with VM/VT) passes
      # this usage, and stop accepting writes below the free-space floor.
      - "-retention.maxDiskUsagePercent=${VL_MAX_DISK_USAGE_PERCENT:-80}"
      - "-storage.minFreeDiskSpaceBytes=${VL_MIN_FREE_DISK:-1GiB}"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  victoriatraces:
    image: victoriametrics/victoria-traces:${VT_VERSION:-v0.8.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:10428:10428"
    volumes:
      - ./data/vt:/storage
    command:
      - "-storageDataPath=/storage"
      - "-httpListenAddr=:10428"
      - "-retentionPeriod=${VT_RETENTION_PERIOD:-7d}"
      # Same disk guards as victorialogs.
      - "-retention.maxDiskUsagePercent=${VT_MAX_DISK_USAGE_PERCENT:-80}"
      - "-storage.minFreeDiskSpaceBytes=${VT_MIN_FREE_DISK:-1GiB}"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:10428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  vmalert:
    image: victoriametrics/vmalert:${VMALERT_VERSION:-v1.142.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    command:
      - "-rule=/etc/vmalert/rules/*.yml"
      - "-rule=/etc/vmalert/rules/*/*.yml"
      - "-datasource.url=http://victoriametrics:8428"
      - "-remoteWrite.url=http://victoriametrics:8428"
      - "-evaluationInterval=30s"
      - "-httpListenAddr=:8880"
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8880/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    restart: unless-stopped
    # Internal-only: Grafana is reached through Traefik's `web` entrypoint
    # (traefik/dynamic/grafana.yml), never published directly. Control its
    # exposure with TRAEFIK_WEB_BIND on the traefik service above. Grafana ships
    # anonymous-Admin (see README "Security model") -- only expose on a trusted
    # network.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Pinned: an unpinned install yields a different plugin on every recreate.
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource ${VL_PLUGIN_VERSION:-0.33.1}
      # Don't let Grafana fetch its own "preinstalled" plugins (e.g. lokiexplore).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # Named volume: nothing in Grafana's state is source of truth (datasources
      # and dashboards are provisioned from ./grafana/, the plugin is pinned),
      # and Docker sets the ownership Grafana (uid 472) needs.
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
      victoriatraces:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.151.0}
    restart: unless-stopped
    # No Docker healthcheck: the image is FROM scratch (no shell, wget or curl).
    # Instead Traefik probes the health_check extension on :13133 from outside
    # (traefik/dynamic/otlp.yml) and stops routing to an unhealthy collector.
    # The memory_limiter processor sizes itself from this limit.
    mem_limit: ${OTELCOL_MEM_LIMIT:-512m}
    environment:
      OTLP_TOKEN: ${OTLP_TOKEN:?set OTLP_TOKEN in .env}
      OTLP_TOKEN_NEXT: ${OTLP_TOKEN_NEXT:-${OTLP_TOKEN}}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
      victoriatraces:
        condition: service_healthy

volumes:
  grafana-data:
