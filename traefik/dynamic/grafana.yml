# Grafana UI router: forward the `web` entrypoint to Grafana over the internal
# docker network. Grafana is never published directly; it is only reachable
# through Traefik. Whether the `web` entrypoint is on the LAN or loopback is set
# by TRAEFIK_WEB_BIND in docker-compose.yml (default loopback -> SSH tunnel).
http:
  routers:
    grafana:
      entryPoints:
        - web
      rule: "PathPrefix(`/`)"
      service: grafana
  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
