name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare env
        run: echo "OTLP_TOKEN=ci-test-token" > .env

      - name: Validate compose
        run: docker compose config -q

      - name: Bring up stack (no-TLS default)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test (metric + log + span through Traefik into each store)
        run: scripts/smoke.sh

      - name: Grafana reachable through Traefik (web entrypoint)
        run: |
          set -euo pipefail
          # TRAEFIK_WEB_BIND defaults to 127.0.0.1:80 -> Traefik web -> grafana.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/api/health)
          echo "Grafana via Traefik :80 -> $code"; [ "$code" = "200" ]

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
