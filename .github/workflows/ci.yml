name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so breakage from outside the repo (plugin downloads, the runner
  # image, Docker Hub) surfaces without waiting for a push.
  schedule:
    - cron: "23 5 * * 1"

jobs:
  validate:
    name: stack (OTLP_TLS_MODE=${{ matrix.tls }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # acme needs a real domain + DNS credentials, so it isn't tested here.
        tls: [none, byocert]
    steps:
      - uses: actions/checkout@v5

      - name: Prepare env
        run: |
          echo "OTLP_TOKEN=ci-test-token" > .env
          echo "OTLP_TLS_MODE=${{ matrix.tls }}" >> .env

      - name: Self-signed cert for localhost (byocert)
        if: matrix.tls == 'byocert'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost \
            -keyout certs/tls.key -out certs/tls.crt
          # smoke.sh's curl must trust it; this also proves Traefik serves it.
          echo "CURL_CA_BUNDLE=$PWD/certs/tls.crt" >> "$GITHUB_ENV"

      - name: Validate compose
        run: docker compose config -q

      - name: Vendored upstream dashboards/rules match the pinned versions
        if: matrix.tls == 'none'
        run: scripts/vendor-upstream.sh && git diff --exit-code

      - name: Validate collector config (pinned image)
        run: |
          img=$(docker compose config --format json | jq -r '.services["otel-collector"].image')
          docker run --rm -v "$PWD/otel-collector-config.yaml:/c.yaml:ro" \
            -e OTLP_TOKEN=x -e OTLP_TOKEN_NEXT=x "$img" validate --config=/c.yaml

      - name: Bring up stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test (metric + log + span through Traefik into each store)
        run: scripts/smoke.sh

      - name: Grafana and its datasources, through Traefik (web entrypoint)
        run: |
          set -euo pipefail
          # TRAEFIK_WEB_BIND defaults to 127.0.0.1:80 -> Traefik web -> grafana.
          G=http://localhost:80
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "$G$2"); echo "$1 -> $code"; [ "$code" = 200 ]; }
          check "grafana health" /api/health
          for uid in victoriametrics victorialogs victoriatraces victoriatraces_logs; do
            check "datasource $uid" "/api/datasources/uid/$uid/health"
          done
          # And a real query through the Jaeger API (the smoke span's service).
          check "jaeger services query" /api/datasources/proxy/uid/victoriatraces/api/services

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
