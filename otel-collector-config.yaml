extensions:
  bearertokenauth/server:
    scheme: Bearer
    token: ${env:OTLP_TOKEN}
  # Probed by Traefik's load-balancer health check (traefik/dynamic/otlp.yml);
  # the image is FROM scratch, so Docker itself can't probe it.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/server
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth/server

processors:
  # First in every pipeline: refuses data (clients get 429/503 and retry)
  # before the container hits its mem_limit (docker-compose.yml).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp_http/vm:
    endpoint: http://victoriametrics:8428/opentelemetry
  otlp_http/vl:
    endpoint: http://victorialogs:9428/insert/opentelemetry
  otlp_http/vt:
    endpoint: http://victoriatraces:10428/insert/opentelemetry

service:
  extensions: [health_check, bearertokenauth/server]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vl]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vt]
