apiVersion: 1

datasources:
  # Explicit uids are RECOMMENDED: dashboards that reference a datasource by uid
  # (rather than by name) bind to these stable values. Without explicit uids
  # Grafana assigns random ones and such panels show "datasource not found".
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428

  - name: VictoriaTraces
    uid: victoriatraces
    type: jaeger
    access: proxy
    url: http://victoriatraces:10428/select/jaeger

  # Second datasource pointing at the SAME VictoriaTraces server, using its
  # LogsQL endpoint (/select/logsql/query) instead of the Jaeger-compat
  # search API. Spans return as rows-with-fields, so dashboards can pivot
  # span attributes into table columns and run LogsQL aggregates
  # (`stats by ...`, `quantile`, `sort by`) that the Jaeger search API
  # doesn't expose. Same disk, same data, different query surface.
  - name: VictoriaTraces-Logs
    uid: victoriatraces_logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoriatraces:10428
